<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pago no completado — MNI Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg-soft:#F4FAFB;--ink:#1F2A30;--green:#1F4B3F;--terracota:#D9713C;--muted:#647178;--line:#E7EEF0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-soft);color:var(--ink);font-family:"Inter",sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:20px 24px;background:#fff;border-bottom:1px solid var(--line);}
  .logo{font-family:"Poppins",sans-serif;font-weight:800;font-size:1.3rem;color:var(--green);text-decoration:none;}
  .logo span{font-weight:600;color:var(--terracota);}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .card{background:#fff;border-radius:24px;padding:44px 40px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(31,75,63,0.12);}
  .icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 20px;}
  h1{font-family:"Poppins",sans-serif;color:var(--green);font-size:1.6rem;margin-bottom:12px;}
  p{color:var(--muted);font-size:0.97rem;margin-bottom:14px;}
  .order{background:var(--bg-soft);border-radius:12px;padding:12px 16px;font-size:0.88rem;color:var(--ink);margin:18px 0;}
  .steps{text-align:left;margin:18px 0 6px;padding-left:20px;color:var(--muted);font-size:0.93rem;}
  .steps li{margin-bottom:8px;}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
  .btn{padding:14px 26px;border-radius:14px;font-weight:700;font-size:0.93rem;text-decoration:none;}
  .btn-primary{background:var(--terracota);color:#fff;}
  .btn-ghost{border:1.5px solid var(--line);color:var(--green);}
</style>
</head>
<body>
<header><a class="logo" href="index.html">MNI <span>Travel</span></a></header>
<main>
  <div class="card">
    <div class="icon" style="background:#FBEAE0;">!</div>
    <h1>No pudimos completar el pago</h1>
    <p>Tu reserva todavía no quedó confirmada. Puedes intentarlo nuevamente o escribirnos y te ayudamos a reservar por WhatsApp.</p>
    <p>Si ves un cobro en tu tarjeta o cuenta, escríbenos y lo revisamos de inmediato.</p>
    <div class="btns">
      <a class="btn btn-primary" href="index.html#reservar">Intentar de nuevo</a>
      <a class="btn btn-ghost" href="https://wa.me/56952162459?text=Hola%2C%20tuve%20un%20problema%20con%20el%20pago%20de%20mi%20reserva" target="_blank" rel="noopener">Escribir por WhatsApp</a>
    </div>
  </div>
</main>
</body>
</html>
